name: Apply task6 landing performance hardening

on:
  push:
    paths:
      - '.github/workflows/apply-task6-performance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-site-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reserve landing geometry and defer below-fold rendering
        shell: bash
        run: |
          cat >> css/landing.css <<'EOF'

          /* Landing hydration/layout stability hardening */
          .landing-copy{min-height:360px}
          .landing-heading{min-height:150px}
          #landingCategoryGrid{min-height:300px}
          .landing-section{content-visibility:auto;contain-intrinsic-size:auto 720px}
          @media(max-width:980px){.landing-copy{min-height:330px}.landing-heading{min-height:140px}#landingCategoryGrid{min-height:560px}}
          @media(max-width:620px){.landing-copy{min-height:390px}.landing-heading{min-height:155px}#landingCategoryGrid{min-height:1240px}.landing-section{contain-intrinsic-size:auto 900px}}
          EOF
      - name: Verify task6 before commit
        run: node --test tests/landing-performance-hardening.test.cjs
      - name: Commit landing hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/landing.css
          git commit -m 'perf: stabilize landing initial layout'
          git push origin HEAD:fix/full-site-hardening
