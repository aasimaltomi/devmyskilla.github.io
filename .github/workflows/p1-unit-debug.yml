name: Temporary P1 unit debug

on:
  push:
    branches:
      - perf/p1-public-data-split
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture unit test output
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs > p1-unit.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat p1-unit.log
          exit 0
      - name: Upload unit test output
        uses: actions/upload-artifact@v4
        with:
          name: p1-unit-debug
          path: p1-unit.log
      - name: Fail if tests failed
        shell: bash
        run: |
          test "${{ steps.tests.outputs.exit_code }}" = "0"
