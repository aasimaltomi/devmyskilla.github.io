name: Temporary fix category migration guard

on:
  push:
    branches: [refactor/category-single-source]
    paths:
      - '.github/workflows/fix-category-migration-guard.yml'

permissions:
  contents: write

jobs:
  fix-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/category-single-source
      - name: Restrict dependency guard to actual requires
        run: |
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/category-single-source-migration.yml')
          text=path.read_text()
          start=text.index("          if grep -R -n -E 'PlatformCategories|CategoryDirectLinks|platform-categories(-10-20|-21-30|-31-40)?\\.js|category-direct-links\\.js' tests \\")
          end=text.index("          if grep -n -E 'platform-categories|category-direct-links' platform.html sw.js; then", start)
          replacement='''          if grep -R -n -E "require\\([^)]*(platform-categories|category-direct-links)" tests; then\n            echo 'Unexpected test require dependency remains.'\n            exit 1\n          fi\n'''
          path.write_text(text[:start]+replacement+text[end:])
          PY
      - name: Commit corrected guard and remove this one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/category-single-source-migration.yml
          git rm .github/workflows/fix-category-migration-guard.yml
          git commit -m 'chore: narrow category migration dependency guard'
          git push origin HEAD:refactor/category-single-source
