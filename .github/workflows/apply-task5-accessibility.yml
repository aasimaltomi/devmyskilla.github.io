name: Apply task5 accessibility hardening

on:
  push:
    paths:
      - '.github/workflows/apply-task5-accessibility.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-site-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsive navigation and accessibility fixes
        shell: bash
        run: |
          cat > js/accessibility.js <<'EOF'
          (function(){
            const MENU_LABELS={ar:'القائمة',en:'Menu',tr:'Menü'};
            const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

            function tabs(){return [...document.querySelectorAll('.tab-btn[role="tab"]')];}
            function selectTab(selected){
              tabs().forEach(tab=>{
                const isSelected=tab===selected;
                tab.classList.toggle('active',isSelected);
                tab.setAttribute('aria-selected',String(isSelected));
                tab.tabIndex=isSelected?0:-1;
              });
            }
            function selectAll(){const all=document.querySelector('.tab-btn[data-tab="all"]');if(all)selectTab(all);}
            function closeMobileNav(nav,toggle){
              if(!nav||!toggle)return;
              nav.classList.remove('mobile-nav-open');
              toggle.setAttribute('aria-expanded','false');
            }
            function updateMenuLabel(toggle){
              if(!toggle)return;
              const lang=(document.documentElement.lang||'ar').toLowerCase();
              toggle.setAttribute('aria-label',MENU_LABELS[lang]||MENU_LABELS.en);
            }
            function initMobileNav(){
              const nav=document.querySelector('.main-nav');
              const inner=nav&&nav.closest('.nav-inner');
              if(!nav||!inner||inner.querySelector('.mobile-nav-toggle'))return;
              if(!nav.id)nav.id='mobilePrimaryNav';
              const toggle=document.createElement('button');
              toggle.type='button';
              toggle.className='icon-btn mobile-nav-toggle';
              toggle.setAttribute('aria-controls',nav.id);
              toggle.setAttribute('aria-expanded','false');
              toggle.textContent='☰';
              updateMenuLabel(toggle);
              const actions=inner.querySelector('.nav-actions');
              inner.insertBefore(toggle,actions||null);
              toggle.addEventListener('click',()=>{
                const opening=!nav.classList.contains('mobile-nav-open');
                nav.classList.toggle('mobile-nav-open',opening);
                toggle.setAttribute('aria-expanded',String(opening));
              });
              nav.addEventListener('click',event=>{if(event.target.closest('a,button'))closeMobileNav(nav,toggle);});
              document.addEventListener('click',event=>{if(!inner.contains(event.target))closeMobileNav(nav,toggle);});
              const switcher=document.getElementById('langSwitcher');
              if(switcher)switcher.addEventListener('change',()=>queueMicrotask(()=>updateMenuLabel(toggle)));
            }
            function handleTabKeys(event){
              const current=event.target.closest&&event.target.closest('.tab-btn[role="tab"]');
              if(!current)return false;
              const keys=['ArrowRight','ArrowLeft','Home','End'];
              if(!keys.includes(event.key))return false;
              const list=tabs();
              if(!list.length)return false;
              event.preventDefault();
              const index=Math.max(0,list.indexOf(current));
              const rtl=document.documentElement.dir==='rtl';
              let nextIndex=index;
              if(event.key==='Home')nextIndex=0;
              else if(event.key==='End')nextIndex=list.length-1;
              else if(event.key==='ArrowRight')nextIndex=(index+(rtl?-1:1)+list.length)%list.length;
              else if(event.key==='ArrowLeft')nextIndex=(index+(rtl?1:-1)+list.length)%list.length;
              const next=list[nextIndex];
              next.click();
              next.focus();
              return true;
            }
            function trapModalTab(event){
              if(event.key !== 'Tab')return false;
              const modal=document.querySelector('.modal.open');
              if(!modal)return false;
              const focusable=[...modal.querySelectorAll(FOCUSABLE)].filter(node=>node.getAttribute('aria-hidden')!=='true');
              if(!focusable.length){event.preventDefault();return true;}
              const first=focusable[0],last=focusable[focusable.length-1];
              if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();return true;}
              if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();return true;}
              return false;
            }
            function init(){
              const current=document.querySelector('.tab-btn.active[role="tab"]')||document.querySelector('.tab-btn[role="tab"]');
              if(current)selectTab(current);
              initMobileNav();
            }
            document.addEventListener('DOMContentLoaded',init);
            document.addEventListener('click',event=>{
              const tab=event.target.closest('.tab-btn[role="tab"]');
              if(tab){queueMicrotask(()=>selectTab(tab));return;}
              if(event.target.closest('#resetFilters,[data-quick-filter],[data-category]'))queueMicrotask(selectAll);
            });
            document.addEventListener('keydown',event=>{
              if(handleTabKeys(event)||trapModalTab(event))return;
              if(event.key==='Escape'){
                const nav=document.querySelector('.main-nav.mobile-nav-open');
                const toggle=document.querySelector('.mobile-nav-toggle');
                if(nav&&toggle){closeMobileNav(nav,toggle);toggle.focus();}
              }
            });
          })();
          EOF

          node <<'NODE'
          const fs=require('node:fs');
          function replace(path,from,to){
            let text=fs.readFileSync(path,'utf8');
            if(!text.includes(from))throw new Error(`Expected text not found in ${path}: ${from.slice(0,100)}`);
            text=text.replace(from,to);
            fs.writeFileSync(path,text);
          }
          replace('js/app.js',
            "let allPlatforms=[];let activeTab='all';let deferredInstallPrompt=null;let siteData=null;let inlineEditor=null;",
            "let allPlatforms=[];let activeTab='all';let deferredInstallPrompt=null;let siteData=null;let inlineEditor=null;let modalReturnFocus=null;"
          );
          replace('js/app.js',
            '<button class="round-action ${fav?\'active\':\'\'}" data-action="favorite" data-id="${esc(p.id)}" type="button" aria-pressed="${fav}">${esc(favoriteIcon)}</button><button class="round-action" data-action="share" data-id="${esc(p.id)}" type="button">${esc(shareIcon)}</button>',
            '<button class="round-action ${fav?\'active\':\'\'}" data-action="favorite" data-id="${esc(p.id)}" type="button" aria-pressed="${fav}" aria-label="${esc(fav?getText(\'removeSaved\'):getText(\'savePlatform\'))}">${esc(favoriteIcon)}</button><button class="round-action" data-action="share" data-id="${esc(p.id)}" type="button" aria-label="${esc(getText(\'sharePlatform\'))}">${esc(shareIcon)}</button>'
          );
          replace('js/app.js',
            "function openModal(id){const m=$(id);if(!m)return;m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');const f=m.querySelector('button,a,input,select');if(f)f.focus()}\nfunction closeModal(id){const m=$(id);if(!m)return;m.classList.remove('open');m.setAttribute('aria-hidden','true');if(!document.querySelector('.modal.open'))document.body.classList.remove('modal-open')}",
            "function openModal(id){const m=$(id);if(!m)return;modalReturnFocus=document.activeElement&&document.activeElement!==document.body?document.activeElement:null;m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');const f=m.querySelector('button,a,input,select');if(f)f.focus()}\nfunction closeModal(id){const m=$(id);if(!m)return;m.classList.remove('open');m.setAttribute('aria-hidden','true');if(!document.querySelector('.modal.open')){document.body.classList.remove('modal-open');if(modalReturnFocus&&modalReturnFocus.isConnected&&typeof modalReturnFocus.focus==='function')modalReturnFocus.focus();modalReturnFocus=null}}"
          );
          const css='css/style.css';
          let style=fs.readFileSync(css,'utf8');
          style += `\n/* Responsive primary navigation hardening */\n.mobile-nav-toggle{display:none}\n@media(max-width:1050px){.nav-inner{position:relative}.mobile-nav-toggle{display:grid;place-items:center;flex:0 0 auto}.main-nav.mobile-nav-open{display:flex;position:absolute;top:calc(100% + 8px);inset-inline:0;flex-direction:column;align-items:stretch;gap:0;padding:12px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);z-index:55}.main-nav.mobile-nav-open a,.main-nav.mobile-nav-open .nav-link-btn{width:100%;padding:10px 12px;text-align:start}}\n`;
          fs.writeFileSync(css,style);

          const explore='explore.html';
          let html=fs.readFileSync(explore,'utf8');
          const legacy='<a href="#learningPaths" data-i18n="officialPaths"></a>';
          if(!html.includes(legacy))throw new Error('Expected legacy learning paths nav link not found');
          html=html.replace(legacy,'');
          fs.writeFileSync(explore,html);
          NODE
      - name: Verify task5 before commit
        run: |
          node --check js/accessibility.js
          node --check js/app.js
          node --test tests/accessibility-hardening.test.cjs tests/learning-paths-suppression.test.cjs
      - name: Commit accessibility fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/accessibility.js js/app.js css/style.css explore.html
          git commit -m 'fix: improve mobile navigation and accessibility'
          git push origin HEAD:fix/full-site-hardening
