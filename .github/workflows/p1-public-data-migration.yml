name: Temporary P1 CMS split generator

on:
  push:
    branches: [perf/p1-public-data-split]
    paths:
      - '.github/workflows/p1-public-data-migration.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Decap generator for split public and research files
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='scripts/generate-decap-config.cjs';
          let s=fs.readFileSync(file,'utf8');
          const must=(before,after,label)=>{
            if(!s.includes(before)) throw new Error(`missing generator anchor: ${label}`);
            s=s.replace(before,after);
          };

          must(
            "const data=validateStableReferences(validateContentData(JSON.parse(fs.readFileSync('data.json','utf8'))));\n",
            "const data=validateStableReferences(validateContentData(JSON.parse(fs.readFileSync('data.json','utf8'))));\nconst research=JSON.parse(fs.readFileSync('research-data.json','utf8'));\nconst {reconstructPlatforms}=require('./validate-research-data.cjs');\nreconstructPlatforms(data,research);\n",
            'load research data'
          );

          must(
            "function platformResearchFields(indent){\n  const out=[];",
            "function platformResearchFields(indent,mode='all'){\n  const out=[];\n  if(mode!=='researchOnly'){",
            'research function start'
          );
          must(
            "  out.push(scalar('رابط المجال الرسمي','officialUrl','string',indent+4,['required: false']));\n  out.push(`${pad(indent)}- label: ${q('المسارات الرسمية / Official Paths')}",
            "  out.push(scalar('رابط المجال الرسمي','officialUrl','string',indent+4,['required: false']));\n  }\n  if(mode!=='fieldsOnly'){\n  out.push(`${pad(indent)}- label: ${q('المسارات الرسمية / Official Paths')}",
            'split fields from paths'
          );
          must(
            "  out.push(scalar('رابط جميع المسارات','allPathsUrl','string',indent+4,['required: false']));\n  return out.join('\\n');\n}\nfunction platformFields(indent){",
            "  out.push(scalar('رابط جميع المسارات','allPathsUrl','string',indent+4,['required: false']));\n  }\n  return out.join('\\n');\n}\nfunction platformFields(indent,researchMode='fieldsOnly') {",
            'research function end and platform signature'
          );
          must(
            "  out.push(platformResearchFields(indent));",
            "  out.push(platformResearchFields(indent,researchMode));",
            'platform research mode'
          );

          const fieldsAnchor="fields.push(`${pad(10)}- label: ${q('المنصات')}\\n${pad(10)}  name: platforms\\n${pad(10)}  widget: list\\n${pad(10)}  summary: ${q('{{fields.id}} — {{fields.name.en}}')}\\n${pad(10)}  fields:`);fields.push(platformFields(14));\n";
          const researchBuild=`${fieldsAnchor}\nconst researchFields=[];\nresearchFields.push(\`${'${pad(10)}'}- label: ${'${q(\'بحث المنصات العامة / Public Platform Research\')}'}\\n${'${pad(10)}'}  name: publicPlatformResearch\\n${'${pad(10)}'}  widget: list\\n${'${pad(10)}'}  summary: ${'${q(\'{{fields.id}}\')}'}\\n${'${pad(10)}'}  fields:\`);\nresearchFields.push(scalar('معرّف المنصة العامة — لا تغيّره','id','string',14,['hint: \"Must match a public platform ID\"']));\nresearchFields.push(platformResearchFields(14,'researchOnly'));\nresearchFields.push(\`${'${pad(10)}'}- label: ${'${q(\'المنصات غير العامة / Non-public Platforms\')}'}\\n${'${pad(10)}'}  name: nonPublicPlatforms\\n${'${pad(10)}'}  widget: list\\n${'${pad(10)}'}  summary: ${'${q(\'{{fields.id}} — {{fields.name.en}}\')}'}\\n${'${pad(10)}'}  fields:\`);\nresearchFields.push(platformFields(14,'all'));\n`;
          must(fieldsAnchor,researchBuild,'research schema builder');

          must(
            "        fields:\n${fields.join('\\n')}\n`;",
            "        fields:\n${fields.join('\\n')}\n      - label: ${q('بيانات البحث الداخلية')}\n        name: research_data\n        file: research-data.json\n        fields:\n${researchFields.join('\\n')}\n`;",
            'research Decap file entry'
          );
          must(
            "console.error(`${path} is not generated from the current data.json schema`)",
            "console.error(`${path} is not generated from the current split data schemas`)",
            'check message'
          );
          must(
            "console.log(`Generated ${path} for full CMS control of ${data.platforms.length} platforms`)",
            "console.log(`Generated ${path} for ${data.platforms.length} public platforms plus research data`)",
            'generation message'
          );
          fs.writeFileSync(file,s);
          NODE
      - name: Regenerate Decap config and verify focused tests
        run: |
          node scripts/generate-decap-config.cjs
          node scripts/generate-decap-config.cjs --check
          node --test tests/decap-cms.test.cjs tests/p1-public-data-split.test.cjs
      - name: Commit generator and generated config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-decap-config.cjs admin/config.yml
          git commit -m "feat: split public and research CMS editing"
          git push origin HEAD:perf/p1-public-data-split
