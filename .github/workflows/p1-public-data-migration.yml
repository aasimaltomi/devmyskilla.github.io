name: Temporary P1 CMS config regeneration

on:
  push:
    branches: [perf/p1-public-data-split]
    paths:
      - '.github/workflows/p1-public-data-migration.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate split Decap config
        run: node scripts/generate-decap-config.cjs
      - name: Verify generated config is deterministic
        run: node scripts/generate-decap-config.cjs --check
      - name: Run split CMS focused tests
        run: node --test tests/decap-cms.test.cjs tests/p1-public-data-split.test.cjs
      - name: Commit generated config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/config.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate split Decap config"
          git push origin HEAD:perf/p1-public-data-split
