name: Temporary P1 CMS config regeneration

on:
  push:
    branches: [perf/p1-public-data-split]
    paths:
      - '.github/workflows/p1-public-data-migration.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate split Decap config
        run: node scripts/generate-decap-config.cjs
      - name: Verify generated config is deterministic
        run: node scripts/generate-decap-config.cjs --check
      - name: Test Decap shell
        run: node --test --test-name-pattern="Decap admin shell" tests/decap-cms.test.cjs
      - name: Test split file entries
        run: node --test --test-name-pattern="Decap uses GitHub main" tests/decap-cms.test.cjs
      - name: Test public CMS groups
        run: node --test --test-name-pattern="Decap exposes all full public CMS groups" tests/decap-cms.test.cjs
      - name: Test public taxonomy fields
        run: node --test --test-name-pattern="Decap exposes translations" tests/decap-cms.test.cjs
      - name: Test research schema
        run: node --test --test-name-pattern="Decap exposes research paths" tests/decap-cms.test.cjs
      - name: Test no duplicated public fields in research
        run: node --test --test-name-pattern="public research rows never duplicate" tests/decap-cms.test.cjs
      - name: Test authoritative public field editor
        run: node --test --test-name-pattern="Decap authoritative public platform field editor" tests/decap-cms.test.cjs
      - name: Test media and OAuth config
        run: node --test --test-name-pattern="image fields use media library" tests/decap-cms.test.cjs
      - name: Test no client secret
        run: node --test --test-name-pattern="Decap configuration contains no OAuth client secret" tests/decap-cms.test.cjs
      - name: Test P1 public split contract
        run: node --test tests/p1-public-data-split.test.cjs
      - name: Commit generated config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/config.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate split Decap config"
          git push origin HEAD:perf/p1-public-data-split
