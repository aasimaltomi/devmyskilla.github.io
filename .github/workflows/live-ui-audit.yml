name: Live production UI audit

on:
  push:
    branches:
      - audit/live-category-links-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run production UI audit
        run: node scripts/live-ui-audit.mjs
      - name: Upload UI audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-audit
          path: live-ui-audit.json
