name: Temporary category single-source migration

on:
  push:
    branches: [refactor/category-single-source]
    paths:
      - '.github/workflows/category-single-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-platform-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/category-single-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize CouponAmI runtime patch into data.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const original = JSON.parse(fs.readFileSync('data.json','utf8'));
          const patch = {
            name:{
              ar:'CouponAmI (سابقًا DiscUdemy)',
              en:'CouponAmI (formerly DiscUdemy)',
              tr:'CouponAmI (eski adıyla DiscUdemy)'
            },
            officialUrl:'https://www.couponami.com/',
            catalogUrl:'https://www.couponami.com/category',
            logo:{
              src:'https://www.google.com/s2/favicons?domain=couponami.com&sz=128',
              alt:{ar:'CouponAmI',en:'CouponAmI',tr:'CouponAmI'}
            },
            description:{
              ar:'منصة مستقلة لاكتشاف كوبونات Udemy المجانية النشطة والمتحقق منها. كانت تُعرف سابقًا باسم DiscUdemy، وهي ليست تابعة لـUdemy.',
              en:'An independent platform for discovering active, verified free Udemy coupons. Formerly DiscUdemy; it is not affiliated with Udemy.',
              tr:'Aktif ve doğrulanmış ücretsiz Udemy kuponlarını keşfetmek için bağımsız bir platformdur. Eski adı DiscUdemy olup Udemy ile bağlantılı değildir.'
            }
          };
          const next={...original,platforms:original.platforms.map(platform=>platform.id==='plat-21'?{...platform,...patch}:platform)};
          const scrub = doc => ({...doc,platforms:doc.platforms.map(platform=>platform.id==='plat-21'?{
            ...platform,
            name:'__PATCH__',officialUrl:'__PATCH__',catalogUrl:'__PATCH__',logo:'__PATCH__',description:'__PATCH__'
          }:platform)});
          assert.deepEqual(scrub(next),scrub(original),'migration changed data outside the approved plat-21 metadata patch');
          assert.deepEqual(next.platforms.filter(p=>p.id!=='plat-21'),original.platforms.filter(p=>p.id!=='plat-21'),'another platform changed');
          fs.writeFileSync('data.json',JSON.stringify(next,null,2)+'\n');
          NODE
      - name: Verify CouponAmI and field parity are green while only runtime removal remains red
        run: |
          set +e
          node --test tests/category-single-source.test.cjs > /tmp/parity.log 2>&1
          status=$?
          cat /tmp/parity.log
          grep -q 'ok .*data.json public fields exactly match the frozen effective runtime baseline' /tmp/parity.log
          grep -q 'ok .*CouponAmI platform metadata is authoritative in data.json before removing its runtime patch' /tmp/parity.log
          grep -q 'not ok .*production page and service worker do not load or precache category mutation scripts' /tmp/parity.log
          test "$status" -ne 0
      - name: Commit authoritative platform metadata
        run: |
          if git diff --quiet -- data.json; then
            echo 'CouponAmI metadata already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m 'refactor: materialize CouponAmI platform metadata'
          git push origin HEAD:refactor/category-single-source
