name: Temporary category single-source browser smoke

on:
  push:
    branches: [refactor/category-single-source]
    paths:
      - '.github/workflows/category-single-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/category-single-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/platform.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site.log
          exit 1
      - name: Smoke representative single-source platform pages
        run: |
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const assert=require('node:assert/strict');
          const legacy=['platform-categories.js','platform-categories-10-20.js','platform-categories-21-30.js','platform-categories-31-40.js','category-direct-links.js'];
          const cases=[['plat-3',11],['plat-19',21],['plat-31',11],['plat-37',0]];
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu']});
            for(const [id,expectedFields] of cases){
              const page=await browser.newPage();
              const pageErrors=[];
              const sameOriginFailures=[];
              const requests=[];
              page.on('pageerror',err=>pageErrors.push(String(err)));
              page.on('request',request=>requests.push(request.url()));
              page.on('requestfailed',request=>{if(request.url().startsWith('http://127.0.0.1:8080/'))sameOriginFailures.push(`${request.url()} :: ${request.failure()?.errorText||''}`)});
              const response=await page.goto(`http://127.0.0.1:8080/platform.html?id=${id}&lang=en`,{waitUntil:'networkidle0'});
              assert.equal(response.status(),200,`${id} document status`);
              await page.waitForFunction(()=>document.querySelector('#platformProfile h1'),{timeout:10000});
              const result=await page.evaluate(async()=>{
                const paths=[...document.querySelectorAll('.profile-paths-section')];
                return{
                  title:document.querySelector('#platformProfile h1')?.textContent?.trim()||'',
                  fieldCount:document.querySelectorAll('.profile-field-chip').length,
                  publicPlatformCount:(await DataLoader.loadSiteData()).platforms.length,
                  learningPathsVisible:paths.some(node=>getComputedStyle(node).display!=='none'&&node.getClientRects().length>0),
                };
              });
              console.log(`${id}: ${JSON.stringify(result)}`);
              assert.ok(result.title,`${id} title rendered`);
              assert.equal(result.fieldCount,expectedFields,`${id} authoritative category count`);
              assert.equal(result.publicPlatformCount,40,`${id} public scope`);
              assert.equal(result.learningPathsVisible,false,`${id} learning paths stay hidden`);
              assert.deepEqual(pageErrors,[],`${id} page errors: ${pageErrors.join('\n')}`);
              assert.deepEqual(sameOriginFailures,[],`${id} same-origin failures: ${sameOriginFailures.join('\n')}`);
              for(const name of legacy)assert.equal(requests.some(url=>url.includes(name)),false,`${id} requested legacy ${name}`);
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
