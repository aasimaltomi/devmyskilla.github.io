name: Temporary category single-source migration

on:
  push:
    branches: [refactor/category-single-source]
    paths:
      - '.github/workflows/category-single-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/category-single-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize frozen fields into data.json with integrity checks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const original = JSON.parse(fs.readFileSync('data.json','utf8'));
          const baseline = JSON.parse(fs.readFileSync('tests/fixtures/category-effective-baseline.json','utf8'));
          const publicIds = new Set(Object.keys(baseline));
          const next = {
            ...original,
            platforms: original.platforms.map(platform => publicIds.has(platform.id)
              ? { ...platform, fields: baseline[platform.id] }
              : platform)
          };
          const scrub = doc => ({
            ...doc,
            platforms: doc.platforms.map(platform => publicIds.has(platform.id)
              ? { ...platform, fields: '__PUBLIC_FIELDS__' }
              : platform)
          });
          assert.deepEqual(scrub(next), scrub(original), 'migration changed data outside public platform fields');
          const originalInternal = original.platforms.filter(p => !publicIds.has(p.id));
          const nextInternal = next.platforms.filter(p => !publicIds.has(p.id));
          assert.deepEqual(nextInternal, originalInternal, 'platforms outside plat-1..plat-40 changed');
          const total = next.platforms
            .filter(p => publicIds.has(p.id))
            .reduce((n,p) => n + (Array.isArray(p.fields) ? p.fields.length : 0), 0);
          assert.equal(total, 363, `expected 363 materialized fields, got ${total}`);
          fs.writeFileSync('data.json', JSON.stringify(next, null, 2) + '\n');
          console.log(`MATERIALIZED_FIELDS=${total}`);
          NODE
      - name: Verify parity assertion is green while runtime override assertion remains red
        run: |
          set +e
          node --test tests/category-single-source.test.cjs > /tmp/parity.log 2>&1
          status=$?
          cat /tmp/parity.log
          grep -q 'data.json public fields exactly match the frozen effective runtime baseline' /tmp/parity.log
          grep -q 'ok .*data.json public fields exactly match the frozen effective runtime baseline' /tmp/parity.log
          grep -q 'not ok .*production page and service worker do not load or precache category mutation scripts' /tmp/parity.log
          test "$status" -ne 0
      - name: Commit materialized data
        run: |
          if git diff --quiet -- data.json; then
            echo 'data.json already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m 'refactor: materialize effective categories in data json'
          git push origin HEAD:refactor/category-single-source
