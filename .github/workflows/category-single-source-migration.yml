name: Temporary category single-source migration

on:
  push:
    branches: [refactor/category-single-source]
    paths:
      - '.github/workflows/category-single-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-field-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/category-single-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print authoritative fields and stale path references
        run: |
          node <<'NODE'
          const data=require('./data.json');
          const affected=['plat-7','plat-8','plat-13','plat-17','plat-18','plat-19','plat-24','plat-25','plat-26','plat-34','plat-37','plat-38','plat-39'];
          for(const id of affected){
            const p=data.platforms.find(x=>x.id===id);
            const valid=new Set((p.fields||[]).map(f=>f.id));
            console.log(`\n=== ${id} ${p.name?.en||''} ===`);
            console.log('FIELDS');
            for(const f of p.fields||[])console.log(`  ${f.id} :: ${f.name?.en||''}`);
            console.log('PATHS_WITH_STALE_REFS');
            for(const path of p.officialPaths||[]){
              const stale=(path.fieldIds||[]).filter(fid=>!valid.has(fid));
              if(stale.length)console.log(`  ${path.id} :: ${path.officialName||path.name?.en||''} :: old=[${(path.fieldIds||[]).join(',')}] stale=[${stale.join(',')}]`);
            }
          }
          NODE
