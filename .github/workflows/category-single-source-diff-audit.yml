name: Temporary category single-source semantic diff audit

on:
  push:
    branches: [refactor/category-single-source]
    paths:
      - '.github/workflows/category-single-source-diff-audit.yml'

permissions:
  contents: read

jobs:
  semantic-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/category-single-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove data.json differs from main only by approved migration operations
        run: |
          git fetch origin main
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process');
          const main=JSON.parse(execFileSync('git',['show','origin/main:data.json'],{encoding:'utf8'}));
          const current=JSON.parse(fs.readFileSync('data.json','utf8'));
          const baseline=JSON.parse(fs.readFileSync('tests/fixtures/category-effective-baseline.json','utf8'));
          const pathMappings={
            'plat-7':{'harvard-data-science':['data-analysis'],'harvard-cs-cybersecurity':['computer-science'],'mit-statistics-data-science':['data-analysis','math'],'cambridge-healthcare-data-science':['data-analysis','healthcare']},
            'plat-8':{'back-end-engineer':['web-development','code-foundations'],'computer-science-path':['computer-science','code-foundations'],'full-stack-engineer':['web-development','code-foundations'],'machine-learning-ai-engineer':['ai','data-science']},
            'plat-13':{'generative-ai-llm':['generative-ai-llms'],'ai-networking':['ai-infrastructure']},
            'plat-17':{'python-developer':['programming-foundations','advanced-programming-frameworks']},
            'plat-18':{'writing-for-research':['writing-research'],'navigating-peer-review':['navigating-peer-review'],'communicating-your-research':['communicating-research'],'career-path':[]},
            'plat-19':{'html-study-plan':['html'],'css-study-plan':['css'],'sql-study-plan':['sql'],'csharp-study-plan':['csharp'],'go-study-plan':[],'r-study-plan':['r'],'php-study-plan':['php']},
            'plat-24':{'intro-generative-ai':['machine-learning-ai']},
            'plat-25':{'responsive-web-design-v9':['responsive-web-design'],'full-stack-developer-v9':['certified-full-stack-developer'],'javascript-algorithms-v8':['javascript-algorithms-data-structures']},
            'plat-26':{'google-data-analytics':['data-science'],'google-cybersecurity':['information-technology'],'ibm-data-science':['data-science'],'meta-front-end':['computer-science'],'machine-learning-specialization':['data-science']},
            'plat-34':{'data-analyst-python':['programming','data-analysis'],'data-engineer-python':['programming','data-engineering'],'machine-learning-engineer':['machine-learning','programming'],'machine-learning-scientist-python':['machine-learning','programming'],'sql-fundamentals':['programming']},
            'plat-37':{'core-matlab-skills':[],'build-matlab-proficiency':[],'data-analysis-matlab':[],'build-simulink-proficiency':[],'visualization-matlab':[],'software-development-matlab':[]},
            'plat-38':{'value-based-selling':['sales','service']},
            'plat-39':{'interview-preparation-kit':[],'preparation-kits':[]},
          };
          const couponPatch={
            name:{ar:'CouponAmI (سابقًا DiscUdemy)',en:'CouponAmI (formerly DiscUdemy)',tr:'CouponAmI (eski adıyla DiscUdemy)'},
            officialUrl:'https://www.couponami.com/',
            catalogUrl:'https://www.couponami.com/category',
            logo:{src:'https://www.google.com/s2/favicons?domain=couponami.com&sz=128',alt:{ar:'CouponAmI',en:'CouponAmI',tr:'CouponAmI'}},
            description:{ar:'منصة مستقلة لاكتشاف كوبونات Udemy المجانية النشطة والمتحقق منها. كانت تُعرف سابقًا باسم DiscUdemy، وهي ليست تابعة لـUdemy.',en:'An independent platform for discovering active, verified free Udemy coupons. Formerly DiscUdemy; it is not affiliated with Udemy.',tr:'Aktif ve doğrulanmış ücretsiz Udemy kuponlarını keşfetmek için bağımsız bir platformdur. Eski adı DiscUdemy olup Udemy ile bağlantılı değildir.'}
          };
          const expected={...main,platforms:main.platforms.map(platform=>{
            let p=platform;
            if(Object.hasOwn(baseline,platform.id))p={...p,fields:baseline[platform.id]};
            if(platform.id==='plat-21')p={...p,...couponPatch};
            if(pathMappings[platform.id])p={...p,officialPaths:(p.officialPaths||[]).map(path=>Object.hasOwn(pathMappings[platform.id],path.id)?{...path,fieldIds:pathMappings[platform.id][path.id]}:path)};
            return p;
          })};
          assert.deepEqual(current,expected,'data.json contains a semantic change outside the approved single-source migration');
          const mainInternal=main.platforms.filter(p=>!/^plat-(?:[1-9]|[1-3][0-9]|40)$/.test(String(p.id||'')));
          const currentInternal=current.platforms.filter(p=>!/^plat-(?:[1-9]|[1-3][0-9]|40)$/.test(String(p.id||'')));
          assert.deepEqual(currentInternal,mainInternal,'platforms outside 1-40 changed');
          assert.equal(Object.values(baseline).reduce((n,fields)=>n+fields.length,0),363);
          console.log('SEMANTIC_DATA_DIFF=APPROVED_ONLY');
          console.log('PUBLIC_FIELDS=363');
          console.log(`INTERNAL_PLATFORMS_UNCHANGED=${mainInternal.length}`);
          NODE
