name: Live category link audit

on:
  push:
    branches:
      - audit/live-category-links-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run live audit
        run: node scripts/live-link-audit.cjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-category-link-audit
          path: live-link-audit.json
          if-no-files-found: warn
