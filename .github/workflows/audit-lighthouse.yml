name: Temporary Lighthouse audit

on:
  push:
    branches: [fix/full-site-hardening]
    paths:
      - '.github/workflows/audit-lighthouse.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/devmyskill-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/devmyskill-http.log
          exit 1
      - name: Measure remaining hydration geometry shifts
        run: |
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu']});
            const configs={
              'index.html':['.landing-copy','.landing-copy .eyebrow','.landing-copy h1','.landing-copy>p','.landing-actions','.landing-actions .btn:first-child','.landing-actions .btn:last-child','.trust-line','.landing-visual'],
              'explore.html':['.hero-copy','.hero-copy .eyebrow','.hero-copy h1','.hero-copy>p','.hero-platform-search','.quick-filter-chips','.hero-actions','.trust-line','.stats-strip']
            };
            for(const [path,selectors] of Object.entries(configs)){
              const page=await browser.newPage();
              await page.setViewport({width:412,height:823,deviceScaleFactor:1,isMobile:true});
              await page.setRequestInterception(true);
              let held=null;
              page.on('request',req=>{
                if(!held && /\/data\.json(?:\?|$)/.test(req.url())){held=req;return;}
                req.continue().catch(()=>{});
              });
              await page.goto(`http://127.0.0.1:8080/${path}`,{waitUntil:'domcontentloaded'});
              for(let i=0;i<100&&!held;i++)await sleep(20);
              if(!held)throw new Error(`${path}: data.json request was not intercepted`);
              const snapshot=()=>page.evaluate((selectors)=>{
                const out={document:{innerWidth,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight}};
                for(const sel of selectors){
                  const el=document.querySelector(sel);
                  if(!el){out[sel]=null;continue;}
                  const r=el.getBoundingClientRect();
                  out[sel]={top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),width:Math.round(r.width),text:(el.textContent||'').trim().slice(0,120)};
                }
                return out;
              },selectors);
              const before=await snapshot();
              console.log(`${path} BEFORE=${JSON.stringify(before)}`);
              await held.continue();
              if(path==='explore.html') await page.waitForFunction(()=>document.querySelectorAll('#platformGrid .platform-card').length>0,{timeout:10000});
              else await page.waitForFunction(()=>document.querySelector('.landing-copy h1')?.textContent?.trim().length>0,{timeout:10000});
              await sleep(500);
              const after=await snapshot();
              console.log(`${path} AFTER=${JSON.stringify(after)}`);
              for(const sel of selectors){
                const a=before[sel],b=after[sel];
                if(a&&b)console.log(`${path} DELTA ${sel}: top=${b.top-a.top} height=${b.height-a.height} width=${b.width-a.width}`);
              }
              console.log(`${path} DOCUMENT_DELTA width=${after.document.scrollWidth-before.document.scrollWidth} height=${after.document.scrollHeight-before.document.scrollHeight}`);
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
