name: Temporary Lighthouse audit

on:
  push:
    branches: [fix/full-site-hardening]
    paths:
      - '.github/workflows/audit-lighthouse.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-site-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured CLS and font-loading fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const marker='/* Measured mobile hydration stability */';
          const cssPath='css/branding.css';
          let css=fs.readFileSync(cssPath,'utf8');
          if(!css.includes(marker)){
            css += `\n${marker}\n@media(max-width:680px){body .hero-copy{min-height:480px}}\n@media(max-width:620px){body .landing-copy{min-height:520px}}\n`;
            fs.writeFileSync(cssPath,css);
          }
          const old='<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">';
          const replacement='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=optional" onload="this.onload=null;this.rel=\'stylesheet\'">';
          for(const path of ['index.html','explore.html','platform.html']){
            let html=fs.readFileSync(path,'utf8');
            if(!html.includes(old))throw new Error(`Google Fonts link not found in ${path}`);
            html=html.replace(old,replacement);
            fs.writeFileSync(path,html);
          }
          NODE
          node --test tests/landing-performance-hardening.test.cjs tests/site-runtime.test.cjs
      - name: Commit measured performance fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/branding.css index.html explore.html platform.html
          git commit -m 'perf: eliminate measured hydration layout shifts'
          git push origin HEAD:fix/full-site-hardening
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/devmyskill-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/devmyskill-http.log
          exit 1
      - name: Run Lighthouse on home and explore
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8080/index.html --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path=lighthouse-index.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8080/explore.html --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path=lighthouse-explore.json
      - name: Print Lighthouse scores and Web Vitals
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const [name,file] of [['home','lighthouse-index.json'],['explore','lighthouse-explore.json']]){
            const r=JSON.parse(fs.readFileSync(file,'utf8'));
            const pct=k=>Math.round((r.categories[k]?.score||0)*100);
            const a=r.audits;
            console.log(`${name}: performance=${pct('performance')} accessibility=${pct('accessibility')} best-practices=${pct('best-practices')} seo=${pct('seo')} FCP=${a['first-contentful-paint']?.displayValue} LCP=${a['largest-contentful-paint']?.displayValue} TBT=${a['total-blocking-time']?.displayValue} CLS=${a['cumulative-layout-shift']?.displayValue}`);
            const shifts=a['layout-shifts']?.details?.items||[];
            for(const item of shifts.slice(0,5)) console.log(`${name} shift: ${JSON.stringify({score:item.score,selector:item.node?.selector,causes:item.subItems?.items?.map(x=>x.cause||x.extra?.cause).filter(Boolean)})}`);
          }
          NODE
