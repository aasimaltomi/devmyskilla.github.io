name: Temporary Lighthouse audit

on:
  push:
    branches: [fix/full-site-hardening]
    paths:
      - '.github/workflows/audit-lighthouse.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/devmyskill-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/devmyskill-http.log
          exit 1
      - name: Run repeated Lighthouse measurements
        run: |
          for page in index explore; do
            for run in 1 2; do
              npx --yes lighthouse@12.8.2 "http://127.0.0.1:8080/${page}.html" --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path="lighthouse-${page}-${run}.json"
            done
          done
      - name: Print repeated scores, Web Vitals and long-task diagnostics
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const rows=[];
          for(const page of ['index','explore']){
            for(const run of [1,2]){
              const r=JSON.parse(fs.readFileSync(`lighthouse-${page}-${run}.json`,'utf8'));
              const pct=k=>Math.round((r.categories[k]?.score||0)*100);
              const a=r.audits;
              const row={
                page:page==='index'?'home':'explore',run,
                performance:pct('performance'),accessibility:pct('accessibility'),bestPractices:pct('best-practices'),seo:pct('seo'),
                fcp:a['first-contentful-paint']?.numericValue||0,lcp:a['largest-contentful-paint']?.numericValue||0,
                tbt:a['total-blocking-time']?.numericValue||0,cls:a['cumulative-layout-shift']?.numericValue||0
              };
              rows.push(row);
              console.log(`${row.page}#${run}: performance=${row.performance} accessibility=${row.accessibility} best-practices=${row.bestPractices} seo=${row.seo} FCP=${Math.round(row.fcp)}ms LCP=${Math.round(row.lcp)}ms TBT=${Math.round(row.tbt)}ms CLS=${row.cls.toFixed(3)}`);
              const shifts=a['layout-shifts']?.details?.items||[];
              for(const item of shifts.slice(0,3)) console.log(`${row.page}#${run} shift: ${JSON.stringify(item)}`);
              if(page==='index'){
                const tasks=a['long-tasks']?.details?.items||[];
                console.log(`${row.page}#${run} long tasks: ${JSON.stringify(tasks.slice(0,5))}`);
                const boot=a['bootup-time']?.details?.items||[];
                console.log(`${row.page}#${run} bootup top: ${JSON.stringify(boot.sort((x,y)=>(y.total||0)-(x.total||0)).slice(0,5))}`);
              }
            }
          }
          for(const page of ['home','explore']){
            const values=rows.filter(r=>r.page===page);
            const avg=k=>values.reduce((s,r)=>s+r[k],0)/values.length;
            console.log(`${page} avg: performance=${avg('performance').toFixed(1)} TBT=${Math.round(avg('tbt'))}ms CLS=${avg('cls').toFixed(3)} LCP=${Math.round(avg('lcp'))}ms`);
          }
          NODE
