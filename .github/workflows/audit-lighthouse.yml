name: Temporary Lighthouse audit

on:
  push:
    branches: [fix/full-site-hardening]
    paths:
      - '.github/workflows/audit-lighthouse.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/devmyskill-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/devmyskill-http.log
          exit 1
      - name: Verify mobile document width after hydration
        run: |
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu']});
            for(const path of ['index.html','explore.html']){
              const page=await browser.newPage();
              await page.setViewport({width:412,height:823,deviceScaleFactor:1,isMobile:true});
              await page.goto(`http://127.0.0.1:8080/${path}`,{waitUntil:'networkidle0'});
              if(path==='explore.html') await page.waitForFunction(()=>document.querySelectorAll('#platformGrid .platform-card').length>0,{timeout:10000});
              const metrics=await page.evaluate(()=>({innerWidth,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,heroCopyWidth:Math.round(document.querySelector('.hero-copy,.landing-copy')?.getBoundingClientRect().width||0)}));
              console.log(`${path}: ${JSON.stringify(metrics)}`);
              if(metrics.scrollWidth>metrics.clientWidth) throw new Error(`${path} has horizontal overflow: ${metrics.scrollWidth} > ${metrics.clientWidth}`);
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Run Lighthouse on home and explore
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8080/index.html --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path=lighthouse-index.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8080/explore.html --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path=lighthouse-explore.json
      - name: Enforce layout stability and print scores
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let failed=false;
          for(const [name,file] of [['home','lighthouse-index.json'],['explore','lighthouse-explore.json']]){
            const r=JSON.parse(fs.readFileSync(file,'utf8')),a=r.audits;
            const pct=k=>Math.round((r.categories[k]?.score||0)*100);
            const cls=a['cumulative-layout-shift']?.numericValue||0;
            console.log(`${name}: performance=${pct('performance')} accessibility=${pct('accessibility')} best-practices=${pct('best-practices')} seo=${pct('seo')} FCP=${a['first-contentful-paint']?.displayValue} LCP=${a['largest-contentful-paint']?.displayValue} TBT=${a['total-blocking-time']?.displayValue} CLS=${cls.toFixed(3)}`);
            for(const item of (a['layout-shifts']?.details?.items||[]).slice(0,5)) console.log(`${name} shift: ${JSON.stringify(item)}`);
            if(cls>0.1){console.error(`${name} CLS exceeds 0.1`);failed=true;}
          }
          if(failed)process.exit(1);
          NODE
