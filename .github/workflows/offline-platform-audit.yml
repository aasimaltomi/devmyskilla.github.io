name: Offline platform audit

on:
  push:
    branches:
      - audit/live-category-links-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run offline platform audit
        run: node scripts/offline-platform-audit.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-platform-audit
          path: offline-platform-audit.json
