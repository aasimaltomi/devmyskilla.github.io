name: Apply task2 category links

on:
  push:
    paths:
      - '.github/workflows/apply-task2-links.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-site-hardening
      - name: Repair audited category links
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const replacements={
            'js/platform-categories-10-20.js':[
              ['https://www.open.edu/openlearn/money-business/free-courses','https://www.open.edu/openlearn/money-management/free-courses']
            ],
            'js/platform-categories-21-30.js':[
              ['https://www.simplilearn.com/skillup-free-online-courses/business-and-leadership','https://www.simplilearn.com/skillup-free-online-courses/leadership'],
              ['https://www.simplilearn.com/skillup-free-online-courses/it-service-and-architecture','https://www.simplilearn.com/skillup-free-online-courses/management'],
              ['https://www.simplilearn.com/skillup-free-online-courses/quality-management','https://www.simplilearn.com/skillup-free-online-courses/quality-assurance'],
              ['https://www.simplilearn.com/skillup-free-online-courses/product-and-design','https://www.simplilearn.com/skillup-free-online-courses/ui-ux'],
              ['https://www.simplilearn.com/skillup-free-online-courses/personal-development','https://www.simplilearn.com/skillup-free-online-courses/self-development'],
              ['https://alison.com/courses/sales-and-marketing','https://alison.com/courses/marketing'],
              ['https://alison.com/courses/engineering-and-construction','https://alison.com/courses/engineering'],
              ['https://alison.com/courses/teaching-and-academics','https://alison.com/courses/education']
            ]
          };
          for(const [path,pairs] of Object.entries(replacements)){
            let text=fs.readFileSync(path,'utf8');
            for(const [from,to] of pairs){
              if(!text.includes(from)) throw new Error(`Expected audited URL not found in ${path}: ${from}`);
              text=text.replace(from,to);
            }
            fs.writeFileSync(path,text);
          }
          NODE
      - name: Verify task2 before commit
        run: node --test tests/stale-category-links.test.cjs tests/platform-categories-10-20.test.cjs tests/platform-categories-21-30.test.cjs tests/category-link-audit.test.cjs
      - name: Commit link repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/platform-categories-10-20.js js/platform-categories-21-30.js
          git commit -m 'fix: repair stale category destinations'
          git push origin HEAD:fix/full-site-hardening
